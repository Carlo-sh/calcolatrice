<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calcolatrice</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet" />
  </head>
  <body>
    <h1>calcolatrice</h1>

    <div id="container">
      <div id="display"></div>
      <div class="calc-btn num-btn">7</div>
      <div class="calc-btn num-btn">8</div>
      <div class="calc-btn num-btn">9</div>
      <div class="calc-btn op-btn">x</div>
      <div class="calc-btn op-btn">/</div>
      <div class="calc-btn num-btn">4</div>
      <div class="calc-btn num-btn">5</div>
      <div class="calc-btn num-btn">6</div>
      <div class="calc-btn op-btn">+</div>
      <div class="calc-btn op-btn">-</div>
      <div class="calc-btn num-btn">1</div>
      <div class="calc-btn num-btn">2</div>
      <div class="calc-btn num-btn">3</div>
      <div id="equal-btn" class="calc-btn">=</div>
      <div id="zero" class="calc-btn num-btn">0</div>
      <div id="floating-point" class="calc-btn">.</div>
      <div id="negative" class="calc-btn">(-)</div>
      <div id="clear-btn" class="calc-btn">clear</div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
